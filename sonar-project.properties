# SonarCloud: https://sonarcloud.io/project/overview?id=RazerRonald_VozLocal
# Análisis manual (con cobertura): npm run coverage:lcov && npx @sonar/scan
# El token va en la variable de entorno SONAR_TOKEN (no se versiona).
sonar.projectKey=RazerRonald_VozLocal
sonar.organization=razerronald
sonar.projectName=VozLocal
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Código de la aplicación. js/vendor son librerías de terceros (PizZip, docxtemplater).
sonar.sources=js,api,server,scripts,css,index.html
sonar.exclusions=js/vendor/**

# Código de pruebas: SonarCloud no le aplica las reglas de seguridad del código de producción
# (por ejemplo, el `new Function` de tests/unittest/puente.mjs que ejecuta las pruebas).
sonar.tests=tests
sonar.test.exclusions=tests/**/node_modules/**

# Cobertura de las pruebas unittest y de Node, generada con c8 (npm run coverage:lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
